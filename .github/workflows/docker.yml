name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev

env:
  DOCKER_TAG: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'dev' && 'staging' || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" \
            --build-arg VITE_BASE_IMAGE_URL="${{ vars.VITE_BASE_IMAGE_URL }}" \
            --build-arg VITE_CURRENCY="${{ vars.VITE_CURRENCY }}" \
            --build-arg VITE_BASE_URL="${{ vars.VITE_BASE_URL }}" \
            --build-arg VITE_APP_ENV="${{ vars.VITE_APP_ENV }}" \
            -t suanhsa​wmtung/azue-perfume-house-web:${{ env.DOCKER_TAG }} .

      - name: Push Docker image
        run: |
          docker push suanhsa​wmtung/azue-perfume-house-web:${{ env.DOCKER_TAG }}
